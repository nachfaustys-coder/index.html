<style>

:root[data-theme="dark"]{--bg:#131a27;--card:#1c2638;--ink:#e8ebf2;--mute:#9aa6bd;--line:#33415b;--gold:#e0b04a;--red:#e8767a;--green:#6fc29c;--bar:#2a3650}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;line-height:1.55;font-size:17px}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:2rem;line-height:1.15;margin:0 0 12px;font-weight:700}
h2{font-size:1.35rem;line-height:1.25;margin:4px 0 8px}
p{margin:0 0 12px}
.mute{color:var(--mute);font-size:.92rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px}
.year{display:inline-block;border-left:4px solid var(--gold);padding-left:8px;font-weight:700;color:var(--gold);margin-bottom:4px}
.meters{display:grid;gap:8px;margin-bottom:16px}
.m{display:grid;grid-template-columns:118px 1fr 44px;align-items:center;gap:8px;font-size:.88rem}
.bar{height:10px;background:var(--bar);border-radius:5px;overflow:hidden}
.fill{height:100%;background:var(--ink);transition:width .7s ease}
.val{text-align:right;font-variant-numeric:tabular-nums}
.d{font-weight:700}.up{color:var(--green)}.dn{color:var(--red)}
button{font:inherit;color:inherit;cursor:pointer}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:10px;min-height:56px}
.opt:hover,.opt:focus-visible{border-color:var(--gold);outline:2px solid var(--gold);outline-offset:1px}
.opt b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:.85rem}
.go{background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:14px 22px;font-weight:700;min-height:48px;width:100%}
.go:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.prog{display:flex;gap:6px;margin-bottom:14px}
.prog i{flex:1;height:4px;border-radius:2px;background:var(--bar)}
.prog i.on{background:var(--gold)}
.score{font-size:2.6rem;font-weight:700;color:var(--gold);line-height:1}
.rev{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.tag{font-weight:700}
.best{color:var(--green)}.bad{color:var(--red)}
.adv{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}.pt{width:44px;height:44px;flex:none}
.bub{background:var(--card);border:1px solid var(--line);border-radius:4px 12px 12px 12px;padding:8px 12px;font-size:.92rem}
.bub b{display:block;font-size:.8rem;color:var(--mute)}
.chips{display:inline-flex;gap:4px;margin-left:auto;align-self:center}
.chip{width:22px;height:22px;border-radius:50%;color:#fff;font-size:.72rem;font-weight:700;display:grid;place-items:center}
header{display:flex;justify-content:space-between;align-items:center;max-width:640px;margin:0 auto;padding:10px 16px 0;font-weight:700;color:var(--mute)}
.lock{opacity:.6;cursor:not-allowed}.note{border-left:3px solid var(--gold);padding-left:10px;margin:0 0 10px;font-size:.9rem}.note b{color:var(--gold)}
#app>*{animation:fd .35s ease both}@keyframes fd{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){#app>*{animation:none}.fill{transition:none}}
</style>
</head>

function shuf(a){a=a.map(function(o,i){o.k=i;return o});for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

app.innerHTML=prog()+bars(S.m)+'<div class="card"><span class="year">Ronda '+(S.i+1)+' de '+R.length+' · '+r.y+'</span><h2>'+r.t+'</h2><p>'+r.s+'</p><p class="mute">'+sit()+'</p></div>'+advHtml(S.i)+S.os.map(function(o,i){return '<button class="opt'+(lk(o)?' lock':'')+'"'+(lk(o)?' disabled':'')+' data-i="'+i+'"><b>'+"ABC"[i]+'</b><span>'+o.l+(lk(o)?'<br><small class="mute">Bloqueada: el Tesoro está por debajo de 20. Se desbloquea al recuperar recursos.</small>':'')+'</span><span class="chips">'+chips(S.i,o.k)+'</span></button>'}).join("");
Array.prototype.forEach.call(document.querySelectorAll(".opt"),function(b){b.onclick=function(){pick(+b.dataset.i)}})}
function pick(i){var r=R[S.i],o0=S.os[i],M=mods(o0),o=Object.assign({},o0,{d:o0.d.map(function(v,k){return v+M.a[k]})}),old=S.m.slice();
S.m=S.m.map(function(v,k){return Math.max(0,Math.min(100,v+o.d[k]))});S.sc+=o.p;S.pk.push({r:r,o:o,ri:S.i,n:M.n});S.tr=Math.max(-3,Math.min(3,S.tr+(o.t||0)));
app.innerHTML=prog()+bars(old)+'<div class="card"><span class="year">'+r.y+'</span><h2>'+r.t+'</h2><p class="tag">Elegiste: '+o.l+'</p><p>En la simulación: '+o.e+'</p></div>'+notes(M.n,r)+react(S.i,o.k)+'<button class="go" id="n">'+(S.i<R.length-1?"Siguiente decisión":"Ver el resultado")+'</button>';
var f=document.querySelectorAll(".fill");setTimeout(function(){f.forEach(function(el,k){el.style.width=S.m[k]+"%"});document.querySelectorAll(".val").forEach(function(v,k){v.innerHTML=S.m[k]+(o.d[k]?' <span class="d '+(o.d[k]>0?'up':'dn')+'">'+(o.d[k]>0?'+':'')+o.d[k]+'</span>':'')})},60);
document.getElementById("n").onclick=function(){if(S.i<R.length-1){S.i++;round()}else end()}}
function end(){var s=S.sc,k=s>=210?0:s>=160?1:s>=110?2:3,dg=0;if(k==0&&(S.m[0]<50||S.m[2]<40)){k=1;dg=1}var f=F[k];
app.innerHTML='<p class="mute">Puntuación final</p><div class="score">'+s+'<span class="mute" style="font-size:1rem"> / 250</span></div><h1 style="color:'+f.c+';margin-top:10px">'+f.n+'</h1><div class="card"><p>'+f.x+'</p>'+(dg?'<p class="mute">Tu puntuación llegaba a «Monarquía unida», pero la Lealtad o la Autoridad finales eran demasiado bajas para una unión plena.</p>':'')+'</div>'+bars(S.m)+'<h2>Tus decisiones</h2>'+S.pk.map(function(p){var b=p.r.o.filter(function(o){return o.p==25})[0];var ok=p.o.p==25;return '<div class="card"><span class="year">'+p.r.y+'</span> <b>'+p.r.t+'</b><p style="margin-top:6px">Tu decisión <span class="'+(ok?'best':'bad')+'">('+p.o.p+' pts)</span>: '+p.o.l+'</p><p class="mute">Efecto: '+fx(p.o.d)+'. Lo respaldó: '+backers(p.ri,p.o.k)+'.'+(p.n.length?' Consecuencias acumuladas: '+p.n.join(' '):'')+'</p>'+(ok?'':'<div class="rev"><p class="best tag">La más equilibrada (25 pts): '+b.l+'</p><p class="mute">'+b.e+'</p></div>')+'</div>'}).join("");window.scrollTo(0,0)}
start();
</script>
